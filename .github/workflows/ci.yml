name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate candidate registry
        run: python3 scripts/rank_candidates.py --check --top 5
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
