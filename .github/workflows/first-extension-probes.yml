name: First extension probes

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/first-extension-probes.yml"
      - "lab/fetch_extension.py"
      - "lab/probe_browser.py"
      - "lab/prepare_unpacked_identity.py"
      - "lab/summarize_probe.py"
      - "lab/mitm_addon.py"
      - "lab/inspect_extension.py"

permissions:
  contents: write

jobs:
  probe:
    name: Probe ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: merlin-ai
            name: Merlin AI
            extension_id: camppjleccjaphfdbohjdohecfnoikec
          - slug: hola-vpn
            name: Hola VPN
            extension_id: gkojfkhlekighikafcpjkiklfbnlmeio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check selenium mitmproxy
      - name: Install matched Chrome for Testing and ChromeDriver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cft
          python - <<'PY'
          import json, pathlib, urllib.request, zipfile
          meta=json.load(urllib.request.urlopen('https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json'))
          stable=meta['channels']['Stable']
          def get(kind):
              return next(x['url'] for x in stable['downloads'][kind] if x['platform']=='linux64')
          for kind in ('chrome','chromedriver'):
              data=urllib.request.urlopen(get(kind)).read()
              p=pathlib.Path('/tmp/cft')/f'{kind}.zip'
              p.write_bytes(data)
              with zipfile.ZipFile(p) as z: z.extractall('/tmp/cft')
          pathlib.Path('/tmp/cft/version.txt').write_text(stable['version']+'\n')
          PY
          chmod +x /tmp/cft/chrome-linux64/chrome /tmp/cft/chromedriver-linux64/chromedriver
          echo "CFT_BINARY=/tmp/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "CFT_DRIVER=/tmp/cft/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
          /tmp/cft/chrome-linux64/chrome --version
          /tmp/cft/chromedriver-linux64/chromedriver --version
      - name: Record environment and canaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "work/${{ matrix.slug }}" "publish/${{ matrix.slug }}"
          "$CFT_BINARY" --version | tee "work/${{ matrix.slug }}/chrome-version.txt"
          TOKENS=$(python - <<'PY'
          import secrets
          tags = ["URL", "BODY", "INPUT", "TITLE"]
          print(",".join(f"SCANDAL_RADAR_{t}_{secrets.token_hex(12).upper()}" for t in tags))
          PY
          )
          echo "SCANDAL_RADAR_CANARIES=$TOKENS" >> "$GITHUB_ENV"
          echo "$TOKENS" > "work/${{ matrix.slug }}/canaries.txt"
      - name: Fetch exact current CRX and prepare original identity
        shell: bash
        run: |
          set -euo pipefail
          VER=$(cat /tmp/cft/version.txt)
          python lab/fetch_extension.py \
            --id "${{ matrix.extension_id }}" \
            --chrome-version "$VER" \
            --out "work/${{ matrix.slug }}/package"
          python lab/prepare_unpacked_identity.py \
            --crx "work/${{ matrix.slug }}/package/${{ matrix.extension_id }}.crx" \
            --unpacked "work/${{ matrix.slug }}/package/unpacked" \
            --expected-id "${{ matrix.extension_id }}" \
            --out "work/${{ matrix.slug }}/runtime-extension" \
            | tee "work/${{ matrix.slug }}/identity.json"
          cp "work/${{ matrix.slug }}/package/static.json" "publish/${{ matrix.slug }}/static.json"
          cp "work/${{ matrix.slug }}/package/SHA256.txt" "publish/${{ matrix.slug }}/SHA256.txt"
          cp "work/${{ matrix.slug }}/identity.json" "publish/${{ matrix.slug }}/identity.json"
      - name: Run no-extension passive control
        shell: bash
        run: |
          set -euo pipefail
          export SCANDAL_RADAR_PROXY_LOG="$PWD/work/${{ matrix.slug }}/baseline-proxy.jsonl"
          mitmdump -q -p 8080 -s lab/mitm_addon.py >"work/${{ matrix.slug }}/baseline-mitm.log" 2>&1 &
          MPID=$!
          trap 'kill $MPID 2>/dev/null || true' EXIT
          sleep 2
          python lab/probe_browser.py \
            --profile "/tmp/scandal-radar-baseline-${{ matrix.slug }}" \
            --out "work/${{ matrix.slug }}/baseline-browser.json" \
            --proxy "http://127.0.0.1:8080" \
            --chrome-binary "$CFT_BINARY" \
            --chromedriver "$CFT_DRIVER" \
            --headless \
            --idle-seconds 20
          kill $MPID 2>/dev/null || true
          wait $MPID 2>/dev/null || true
          trap - EXIT
          cp "work/${{ matrix.slug }}/baseline-browser.json" "publish/${{ matrix.slug }}/baseline-browser.json"
      - name: Run verified extension-present passive probe
        shell: bash
        run: |
          set -uo pipefail
          export SCANDAL_RADAR_PROXY_LOG="$PWD/work/${{ matrix.slug }}/extension-proxy.jsonl"
          mitmdump -q -p 8081 -s lab/mitm_addon.py >"work/${{ matrix.slug }}/extension-mitm.log" 2>&1 &
          MPID=$!
          sleep 2
          python lab/probe_browser.py \
            --profile "/tmp/scandal-radar-extension-${{ matrix.slug }}" \
            --out "work/${{ matrix.slug }}/extension-browser.json" \
            --proxy "http://127.0.0.1:8081" \
            --chrome-binary "$CFT_BINARY" \
            --chromedriver "$CFT_DRIVER" \
            --headless \
            --extension-dir "$PWD/work/${{ matrix.slug }}/runtime-extension" \
            --expected-extension-id "${{ matrix.extension_id }}" \
            --idle-seconds 30
          STATUS=$?
          kill $MPID 2>/dev/null || true
          wait $MPID 2>/dev/null || true
          cat "work/${{ matrix.slug }}/extension-browser.json" || true
          cp "work/${{ matrix.slug }}/extension-browser.json" "publish/${{ matrix.slug }}/extension-browser.json" 2>/dev/null || true
          exit $STATUS
      - name: Summarize differential observations
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python lab/summarize_probe.py \
            --baseline "work/${{ matrix.slug }}/baseline-proxy.jsonl" \
            --extension "work/${{ matrix.slug }}/extension-proxy.jsonl" \
            --tokens "$SCANDAL_RADAR_CANARIES" \
            --static "work/${{ matrix.slug }}/package/static.json" \
            --out "publish/${{ matrix.slug }}/summary.json"
          python - <<'PY'
          import json, pathlib
          slug = "${{ matrix.slug }}"; name = "${{ matrix.name }}"; expected = "${{ matrix.extension_id }}"
          p = pathlib.Path("publish") / slug
          s=json.loads((p/"summary.json").read_text()); st=json.loads((p/"static.json").read_text()); br=json.loads((p/"extension-browser.json").read_text())
          ids=br.get("installed_extension_ids") or []; verified=br.get("ok") is True and expected in ids
          lines=[f"# {name} — corrected first-pass test","","Status: static audit + verified-ID passive differential canary test. This is not a finding of wrongdoing.","",f"- Web Store version archived: `{st.get('version')}`",f"- CRX SHA-256: `{st.get('crx_sha256')}`",f"- Expected extension ID loaded: `{verified}`",f"- Chrome extension IDs observed: `{', '.join(ids) or 'none'}`",f"- Baseline requests observed: `{s.get('baseline_request_count')}`",f"- Extension-present requests observed: `{s.get('extension_request_count')}`",f"- Differential canary-bearing request events: `{len(s.get('differential_canary_request_events', []))}`",f"- Hosts seen only with extension present: `{', '.join(s.get('hosts_only_seen_with_extension', [])) or 'none'}`","","A differential canary event is an E1 lead only. No canary match does not prove absence of collection: a code path may require activation/login/a supported site, or traffic may use a transport this proxy cannot inspect."]
          (p/"README.md").write_text("\n".join(lines)+"\n")
          PY
      - name: Upload full evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-evidence-${{ matrix.slug }}
          path: work/${{ matrix.slug }}
          retention-days: 30
      - name: Upload publishable result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-publish-${{ matrix.slug }}
          path: publish/${{ matrix.slug }}
          retention-days: 30

  publish:
    name: Commit corrected first-pass results
    runs-on: ubuntu-latest
    needs: probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: corrected-publish-*
          path: /tmp/publish
      - name: Replace dynamic first-pass results while preserving live config
        shell: bash
        run: |
          set -euo pipefail
          for d in /tmp/publish/corrected-publish-*; do
            slug="${d##*/corrected-publish-}"
            mkdir -p "results/2026-09-10-first-pass/$slug"
            find "results/2026-09-10-first-pass/$slug" -maxdepth 1 -type f -delete
            cp -R "$d"/* "results/2026-09-10-first-pass/$slug/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A results/2026-09-10-first-pass
          git commit -m "Correct first extension probes using Chrome for Testing" || exit 0
          git pull --rebase origin main
          git push
