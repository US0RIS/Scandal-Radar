name: Hola real-popup UI probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/hola-ui-probe.yml"
      - "lab/probe_hola_ui.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Fetch and prepare exact current Hola package
        run: |
          set -euo pipefail
          rm -rf work/hola-ui publish/hola-ui
          mkdir -p work/hola-ui publish/hola-ui
          python lab/fetch_extension.py \
            --id gkojfkhlekighikafcpjkiklfbnlmeio \
            --chrome-version 153.0.8010.36 \
            --out work/hola-ui/package
          python lab/prepare_unpacked_identity.py \
            --crx work/hola-ui/package/gkojfkhlekighikafcpjkiklfbnlmeio.crx \
            --unpacked work/hola-ui/package/unpacked \
            --expected-id gkojfkhlekighikafcpjkiklfbnlmeio \
            --out work/hola-ui/runtime-extension \
            > publish/hola-ui/identity.json
          cp work/hola-ui/package/SHA256.txt publish/hola-ui/SHA256.txt
      - name: Exercise actual popup UI
        run: |
          xvfb-run -a python lab/probe_hola_ui.py \
            --extension-dir work/hola-ui/runtime-extension \
            --out-dir publish/hola-ui \
            --repetitions 2
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hola-ui-evidence
          path: publish/hola-ui
          retention-days: 30
      - name: Commit UI result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p results/2026-09-10-first-pass/hola-vpn/ui
          cp -R publish/hola-ui/* results/2026-09-10-first-pass/hola-vpn/ui/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/2026-09-10-first-pass/hola-vpn/ui
          git commit -m "Record Hola real-popup UI probe" || exit 0
          git pull --rebase origin main
          git push
